[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-jax"
version = "0.4.30"
description = "Zero-dependency pure Python implementation of the JAX API surface."
authors = [{ name = "Samuel Marks" }]
requires-python = ">=3.9"
dependencies = ["ml-switcheroo-compiler"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.coverage.run]
omit = [
    "fix_docs.py",
    "fix_indent.py",
    "generate_jnp_stubs.py",
    "scripts/*"
]

[tool.ruff.lint]
ignore = ['E402', 'F401', 'F841', 'E741', 'E501']

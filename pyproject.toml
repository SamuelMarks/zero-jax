[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "zero-jax"
version = "0.4.30"
description = "Zero-dependency pure Python implementation of the JAX API surface."
authors = [{ name = "Samuel Marks" }]
requires-python = ">=3.9"
dynamic = ["dependencies", "optional-dependencies"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
test = ["requirements-test.txt"]

[tool.coverage.run]
omit = [
    "fix_docs.py",
    "fix_indent.py",
    "generate_jnp_stubs.py",
    "scripts/*"
]

[tool.ruff.lint]
ignore = ['E402', 'F401', 'F841', 'E741', 'E501']

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "reference: Tests comparing zero-jax to official jax output.",
]

[tool.hatch.metadata]
allow-direct-references = true

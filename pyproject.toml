[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "zero-jax"
version = "0.4.30"
description = "Zero-dependency pure Python implementation of the JAX API surface."
authors = [{ name = "Samuel Marks" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dynamic = ["dependencies", "optional-dependencies"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
test = ["requirements-test.txt"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "reference: Tests comparing zero-jax to official jax output.",
]

[tool.coverage.run]
branch = true
source = ["src/zero_jax", "scripts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
line-length = 300
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "PT", "RET", "RUF", "ANN", "D"]
ignore = ["B007", "B011", "B017", "B905", "D105", "D203", "D213", "E402", "E731", "E741", "F401", "F403", "N801", "N802", "N803", "N806", "PT011", "PT012", "PT015", "PT018", "RUF012", "SIM105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
mypy_path = ["src", "../ml-switcheroo-compiler/src", "../ml-switcheroo-ir/src"]
files = ["src", "scripts", "tests"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_any_unimported = false
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = false
warn_unreachable = false
strict_equality = false
enable_error_code = ["ignore-without-code"]
disable_error_code = [
    "abstract",
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "call-overload",
    "comparison-overlap",
    "dict-item",
    "index",
    "list-item",
    "method-assign",
    "misc",
    "no-any-return",
    "no-redef",
    "operator",
    "override",
    "redundant-expr",
    "return",
    "return-value",
    "type-arg",
    "union-attr",
    "untyped-decorator",
    "valid-type",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = [
    "ml_switcheroo_compiler",
    "ml_switcheroo_compiler.*",
    "ml_switcheroo_ir",
    "ml_switcheroo_ir.*",
    "numpy",
    "numpy.*",
    "jax",
    "jax.*",
    "jaxlib",
    "jaxlib.*",
    "pytest",
    "pytest.*",
    "_pytest",
    "_pytest.*",
    "ml_ecosystem_snapshots",
    "ml_ecosystem_snapshots.*",
    "cdd",
    "cdd.*",
]
ignore_missing_imports = true
follow_imports = "skip"
[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = false
fail-under = 100
exclude = ["build", "dist", ".venv", ".git"]
verbose = 0
quiet = false
color = true
omit-covered-files = false

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check (Fix)
        entry: ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Mypy Strict Type Check
        entry: mypy --config-file pyproject.toml src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: Interrogate 100% Docstring Coverage
        entry: interrogate -vv -f 100 -c pyproject.toml src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: check-strict-typing
        name: Check Strict Typing & Zero Dunders/Getattr/Setattr
        entry: python3 scripts/run_checks.py check_strict_typing
        language: system
        types: [python]
        pass_filenames: false

      - id: check-docstrings
        name: Check 100% AST Docstrings (Args & Returns)
        entry: python3 scripts/run_checks.py check_docstrings
        language: system
        types: [python]
        pass_filenames: false

      - id: check-allowed-imports
        name: Check Allowed Imports
        entry: python3 scripts/run_checks.py check_allowed_imports src/zero_jax scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: enforce-all-list
        name: Enforce __all__ List (No append/extend)
        entry: python3 scripts/run_checks.py enforce_all_list
        language: system
        types: [python]

      - id: check-api-parity
        name: Check API Parity against Snapshot
        entry: python3 scripts/run_checks.py check_api_parity
        language: system
        types: [python]
        pass_filenames: false

      - id: check-ops-coverage
        name: Check 100% Ops Coverage
        entry: python3 scripts/run_checks.py check_ops_coverage
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: Run Pytest 100% Line & Branch Coverage
        entry: env PYTHONPATH=src:../ml-switcheroo-compiler/src pytest --cov=src/zero_jax --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false

      - id: update-badges
        name: Update Coverage Shields
        entry: python3 scripts/run_checks.py update_badges
        language: system
        types: [python]
        pass_filenames: false

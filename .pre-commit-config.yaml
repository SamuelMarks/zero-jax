repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check (Fix)
        entry: ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: Run Pytest Coverage
        entry: env PYTHONPATH=src:../ml-switcheroo-compiler/src pytest --cov=src --cov-report=term-missing
        language: system
        types: [python]
        pass_filenames: false

      - id: update-badges
        name: Update Coverage Shields
        entry: python3 scripts/run_checks.py update_badges
        language: system
        types: [python]
        pass_filenames: false

      - id: check-allowed-imports
        name: Check Allowed Imports
        entry: python3 scripts/run_checks.py check_allowed_imports
        language: system
        types: [python]

      - id: enforce-all-list
        name: Enforce __all__ List (No append/extend)
        entry: python3 scripts/run_checks.py enforce_all_list
        language: system
        types: [python]

      - id: check-api-parity
        name: Check API Parity against Snapshot
        entry: python3 scripts/run_checks.py check_api_parity
        language: system
        types: [python]
        pass_filenames: false

      - id: check-ops-coverage
        name: Check 100% Ops Coverage
        entry: python3 scripts/run_checks.py check_ops_coverage
        language: system
        types: [python]
        pass_filenames: false

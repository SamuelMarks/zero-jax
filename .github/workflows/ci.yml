name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  UV_DYNAMIC_VERSIONING_BYPASS: "2.2.0"
  PDM_BUILD_SCM_VERSION: "2.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zero-jax
    steps:
    - uses: actions/checkout@v7
      with:
        path: zero-jax

    - name: Checkout zero-chex
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-chex
        path: zero-chex

    - name: Checkout zero-flax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-flax
        path: zero-flax

    - name: Checkout zero-grain
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-grain
        path: zero-grain

    - name: Checkout zero-optax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-optax
        path: zero-optax

    - name: Checkout zero-orbax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-orbax
        path: zero-orbax

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy interrogate pytest pytest-cov build pydantic colorama
        pip install "cdd @ git+https://github.com/offscale/cdd-python.git@master"
        pip install --ignore-requires-python --no-deps \
          "griffelib @ git+https://github.com/SamuelMarks/griffe.git@rest#subdirectory=packages/griffelib" \
          "griffecli @ git+https://github.com/SamuelMarks/griffe.git@rest#subdirectory=packages/griffecli" \
          "griffe @ git+https://github.com/SamuelMarks/griffe.git@rest"
        pip install \
          "ml-switcheroo-ir @ https://github.com/SamuelMarks/ml-switcheroo-ir/releases/download/v0.0.4/ml_switcheroo_ir-0.0.4-py3-none-any.whl" \
          "ml-switcheroo-compiler @ https://github.com/SamuelMarks/ml-switcheroo-compiler/releases/download/v0.0.1/ml_switcheroo_compiler-0.0.1-py3-none-any.whl"
        pip install --no-deps \
          "ml-ecosystem-snapshots @ https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/ml_ecosystem_snapshots-0.0.5-py3-none-any.whl"
        pip install --no-deps -e ../zero-chex
        pip install --no-deps -e ../zero-flax
        pip install --no-deps -e ../zero-grain
        pip install --no-deps -e ../zero-optax
        pip install --no-deps -e ../zero-orbax
        if [ -f "pyproject.toml" ]; then pip install --no-deps -e ".[test]"; elif [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting & Docstrings (Ruff)
      run: ruff check .

    - name: Check Static Types (Mypy)
      run: mypy --config-file pyproject.toml src scripts tests

    - name: Check 100% Docstring Coverage (Interrogate)
      run: interrogate -vv -f 100 -c pyproject.toml src scripts tests

    - name: Run Static Compliance & Snapshot Parity Checks
      run: |
        python scripts/run_checks.py check_strict_typing
        python scripts/run_checks.py check_docstrings
        python scripts/run_checks.py check_allowed_imports src/zero_jax scripts tests
        python scripts/run_checks.py enforce_all_list src/zero_jax
        python scripts/run_checks.py check_api_parity
        python scripts/run_checks.py check_ops_coverage

    - name: Test & Branch Coverage (100%)
      run: |
        pytest --cov=src/zero_jax --cov=scripts --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json --cov-fail-under=100

    - name: Update Badges
      run: |
        python scripts/run_checks.py update_badges
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python -m build
